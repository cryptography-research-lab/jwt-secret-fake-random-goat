

services:
  jwt-secret-fake-random-goat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jwt-secret-fake-random-goat
    ports:
      - "10086:10086"
    environment:
      - GIN_MODE=release
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:10086/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s